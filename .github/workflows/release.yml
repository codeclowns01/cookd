name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-npm:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 20 bundles npm 10.
      # Pinned to the 11 line rather than @latest: npm@latest is now 12, which
      # requires node ^22.22.2 || ^24.15.0 || >=26.0.0 and so fails EBADENGINE
      # here — a floating tag broke the v0.2.0 release once already. npm 11
      # supports ^20.17.0 || >=22.9.0, so it tracks this job's node without
      # coupling the release to whatever npm ships next.
      - name: upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      - name: build
        run: npm run build

      - name: publish
        run: npm publish --provenance --access public

  compile-binaries:
    name: compile / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: publish-npm
    strategy:
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            bun-target: bun-linux-x64
          - target: linux-arm64
            os: ubuntu-latest
            bun-target: bun-linux-arm64
          - target: darwin-x64
            os: macos-latest
            bun-target: bun-darwin-x64
          - target: darwin-arm64
            os: macos-latest
            bun-target: bun-darwin-arm64
          - target: windows-x64
            os: windows-latest
            bun-target: bun-windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: setup node (for npm ci)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: install
        run: npm ci

      - name: build
        run: npm run build

      - name: compile binary
        run: bun build ./dist/cli.js --compile --target=${{ matrix.bun-target }} --outfile=cookd-${{ matrix.target }} --external react-devtools-core

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cookd-${{ matrix.target }}
          path: cookd-${{ matrix.target }}*

  create-release:
    name: create github release
    runs-on: ubuntu-latest
    needs: compile-binaries
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: download all binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries/
          merge-multiple: true

      - name: generate checksums
        run: |
          cd binaries
          sha256sum cookd-* > SHA256SUMS
          cat SHA256SUMS

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            binaries/cookd-*
            binaries/SHA256SUMS
          generate_release_notes: true
